name: Build Check

# Compile-only check (iOS Simulator, no signing, no secrets needed).
# Runs on every push so you can catch Swift errors without a Mac.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Build for iOS Simulator
        run: make build
