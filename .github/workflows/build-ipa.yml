name: Build IPA

# Builds a development-signed IPA you can install on your own iPhone.
#
# Required repository VARIABLES (Settings > Secrets and variables > Actions > Variables):
#   APPLE_TEAM_ID   Your 10-character Team ID
#   BUNDLE_PREFIX   e.g. tw.wildfoo.foqos (optional, defaults to tw.wildfoo.foqos)
#
# Required repository SECRETS:
#   ASC_KEY_ID          App Store Connect API key ID
#   ASC_ISSUER_ID       App Store Connect issuer ID
#   ASC_API_KEY_P8      Contents of the AuthKey_XXXX.p8 file
#   CERT_P12_BASE64     base64 of your Apple Development certificate + private key (.p12)
#   CERT_P12_PASSWORD   password of the .p12
#   PROVISIONING_PROFILES_TAR_BASE64
#                       base64 of a tar containing profiles/*.mobileprovision,
#                       produced by ~/foqos-signing/create_profiles.py
#
# Signing is manual on purpose. xcodebuild's automatic signing provisions
# through developerservices2.apple.com, which answers 403 for this account's
# API key and surfaces as "Authentication failed" on every target, even though
# the same key drives the App Store Connect API without trouble. Profiles are
# therefore created out of band and shipped in as a secret.
#
# Regenerate the profiles (and refresh the secret) after registering a new
# device or renewing the certificate, otherwise the IPA will not install.

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Configure signing identifiers
        run: |
          ./scripts/configure-signing.sh \
            "${{ vars.APPLE_TEAM_ID }}" \
            "${{ vars.BUNDLE_PREFIX || 'tw.wildfoo.foqos' }}"

      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          echo "$CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" -P "$CERT_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S "apple-tool:,apple:" \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          rm -f "$RUNNER_TEMP/cert.p12"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$ASC_API_KEY_P8" > "$HOME/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"

      - name: Verify App Store Connect authentication
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          KEY_PATH="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          # Integrity of the transferred key (hashes are safe to print).
          echo "byte count: $(wc -c < "$KEY_PATH")"
          echo "sha256: $(shasum -a 256 "$KEY_PATH" | cut -d' ' -f1)"

          # Homebrew's python refuses system-wide installs (PEP 668), so the
          # JWT check gets its own throwaway environment.
          python3 -m venv "$RUNNER_TEMP/ascvenv"
          "$RUNNER_TEMP/ascvenv/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/ascvenv/bin/python" - <<'PY'
          import jwt, os, time, urllib.request, urllib.error

          key_id = os.environ["ASC_KEY_ID"]
          issuer = os.environ["ASC_ISSUER_ID"]
          key = open(os.path.expanduser(f"~/private_keys/AuthKey_{key_id}.p8")).read()

          now = int(time.time())
          token = jwt.encode(
              {"iss": issuer, "iat": now, "exp": now + 900, "aud": "appstoreconnect-v1"},
              key, algorithm="ES256", headers={"kid": key_id, "typ": "JWT"},
          )
          req = urllib.request.Request(
              "https://api.appstoreconnect.apple.com/v1/bundleIds?limit=200",
              headers={"Authorization": "Bearer " + token},
          )
          try:
              with urllib.request.urlopen(req) as r:
                  import json
                  data = json.load(r)
                  print("AUTH OK - existing bundle ids:")
                  for item in data["data"]:
                      print("  ", item["attributes"]["identifier"])
                  if not data["data"]:
                      print("   (none registered yet)")
          except urllib.error.HTTPError as e:
              print("AUTH FAILED", e.code)
              print(e.read().decode())
              raise SystemExit(1)
          PY

      - name: Install provisioning profiles
        env:
          PROVISIONING_PROFILES_TAR_BASE64: ${{ secrets.PROVISIONING_PROFILES_TAR_BASE64 }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          # Gzipped because the five profiles share enough certificate and
          # plist boilerplate to blow past GitHub's 48 KB secret limit raw.
          echo "$PROVISIONING_PROFILES_TAR_BASE64" | base64 -d > "$RUNNER_TEMP/profiles.tar.gz"
          tar -xzf "$RUNNER_TEMP/profiles.tar.gz" -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP"/profiles/*.mobileprovision "$PROFILE_DIR/"

          ls -1 "$PROFILE_DIR"

      - name: Select provisioning profiles per target
        run: |
          python3 scripts/apply-manual-signing.py \
            "$RUNNER_TEMP/profiles" "${{ vars.APPLE_TEAM_ID }}"

      - name: Archive
        run: |
          # Stamp the run number in as the build number; every build of the
          # same version is otherwise indistinguishable once installed.
          xcodebuild archive \
            -project foqos.xcodeproj \
            -scheme foqos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/foqos.xcarchive" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=YES

      - name: Export IPA
        run: |
          # Build the provisioningProfiles map from the profiles themselves so
          # this stays correct when a target or profile name changes.
          python3 - "$RUNNER_TEMP/profiles" "$RUNNER_TEMP/ExportOptions.plist" <<'PY'
          import glob, os, plistlib, re, sys

          profile_dir, out_path = sys.argv[1], sys.argv[2]
          mapping = {}
          for path in glob.glob(os.path.join(profile_dir, "*.mobileprovision")):
              raw = open(path, "rb").read()
              payload = plistlib.loads(re.search(rb"<\?xml.*?</plist>", raw, re.S).group(0))
              bundle_id = payload["Entitlements"]["application-identifier"].split(".", 1)[1]
              mapping[bundle_id] = payload["Name"]

          options = {
              "method": "debugging",
              "teamID": os.environ["APPLE_TEAM_ID"],
              "signingStyle": "manual",
              "destination": "export",
              "provisioningProfiles": mapping,
          }
          with open(out_path, "wb") as f:
              plistlib.dump(options, f)
          print(options)
          PY

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/foqos.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          ls -la "$RUNNER_TEMP/export"
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: foqos-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14
