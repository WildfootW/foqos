name: Build IPA

# Builds a development-signed IPA you can install on your own iPhone.
#
# Required repository VARIABLES (Settings > Secrets and variables > Actions > Variables):
#   APPLE_TEAM_ID   Your 10-character Team ID
#   BUNDLE_PREFIX   e.g. tw.wildfoo.foqos (optional, defaults to tw.wildfoo.foqos)
#
# Required repository SECRETS:
#   ASC_KEY_ID          App Store Connect API key ID
#   ASC_ISSUER_ID       App Store Connect issuer ID
#   ASC_API_KEY_P8      Contents of the AuthKey_XXXX.p8 file
#   CERT_P12_BASE64     base64 of your Apple Development certificate + private key (.p12)
#   CERT_P12_PASSWORD   password of the .p12
#
# Your iPhone's UDID must be registered in the developer portal
# (Certificates, Identifiers & Profiles > Devices) BEFORE running this,
# otherwise the development provisioning profile will not include the device.

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Configure signing identifiers
        run: |
          ./scripts/configure-signing.sh \
            "${{ vars.APPLE_TEAM_ID }}" \
            "${{ vars.BUNDLE_PREFIX || 'tw.wildfoo.foqos' }}"

      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          echo "$CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" -P "$CERT_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S "apple-tool:,apple:" \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          rm -f "$RUNNER_TEMP/cert.p12"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$ASC_API_KEY_P8" > "$HOME/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"

      - name: Verify App Store Connect authentication
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          KEY_PATH="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          # Integrity of the transferred key (hashes are safe to print).
          echo "byte count: $(wc -c < "$KEY_PATH")"
          echo "line count: $(wc -l < "$KEY_PATH")"
          echo "sha256: $(shasum -a 256 "$KEY_PATH" | cut -d' ' -f1)"
          head -1 "$KEY_PATH"
          tail -1 "$KEY_PATH"

          python3 -m pip install --quiet --user pyjwt cryptography
          python3 - <<'PY'
          import jwt, os, time, urllib.request, urllib.error

          key_id = os.environ["ASC_KEY_ID"]
          issuer = os.environ["ASC_ISSUER_ID"]
          key = open(os.path.expanduser(f"~/private_keys/AuthKey_{key_id}.p8")).read()

          now = int(time.time())
          token = jwt.encode(
              {"iss": issuer, "iat": now, "exp": now + 900, "aud": "appstoreconnect-v1"},
              key, algorithm="ES256", headers={"kid": key_id, "typ": "JWT"},
          )
          req = urllib.request.Request(
              "https://api.appstoreconnect.apple.com/v1/bundleIds?limit=200",
              headers={"Authorization": "Bearer " + token},
          )
          try:
              with urllib.request.urlopen(req) as r:
                  import json
                  data = json.load(r)
                  print("AUTH OK - existing bundle ids:")
                  for item in data["data"]:
                      print("  ", item["attributes"]["identifier"])
                  if not data["data"]:
                      print("   (none registered yet)")
          except urllib.error.HTTPError as e:
              print("AUTH FAILED", e.code)
              print(e.read().decode())
              raise SystemExit(1)
          PY

      - name: Archive
        run: |
          xcodebuild archive \
            -project foqos.xcodeproj \
            -scheme foqos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/foqos.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            CODE_SIGN_STYLE=Automatic

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>debugging</string>
            <key>teamID</key>
            <string>${{ vars.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/foqos.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

          ls -la "$RUNNER_TEMP/export"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: foqos-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14
